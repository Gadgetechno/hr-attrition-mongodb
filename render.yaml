services:
  - type: web
    name: hr-attrition-mongodb
    runtime: python
    region: oregon
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: MONGO_URI
        sync: false
      - key: DB_NAME
        value: hr_analytics
      - key: AUTO_INIT_DB
        value: "true"
